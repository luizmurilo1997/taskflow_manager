name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Permite execução manual, útil para o Act

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PostgreSQL client
        run: |
          if command -v apt-get &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          else
            echo "Skipping PostgreSQL client installation (not on Ubuntu)"
          fi

      - name: Verify entrypoint script
        run: |
          if [ ! -f "scripts/docker-entrypoint.sh" ]; then
            echo "Warning: scripts/docker-entrypoint.sh does not exist!"
            mkdir -p scripts
            echo '#!/bin/bash' > scripts/docker-entrypoint.sh
            echo 'exec uvicorn app.main:app --host 0.0.0.0 --port 8000' >> scripts/docker-entrypoint.sh
            chmod +x scripts/docker-entrypoint.sh
            echo "Created default entrypoint script"
          else
            echo "Entrypoint script exists"
            chmod +x scripts/docker-entrypoint.sh
          fi

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          # Tenta conectar ao PostgreSQL, mas não falha se não conseguir (útil para Act)
          for i in {1..20}; do
            if command -v pg_isready &> /dev/null; then
              if pg_isready -h localhost -p 5432; then
                echo "PostgreSQL is ready"
                break
              fi
            else
              echo "pg_isready not available, assuming PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... attempt $i"
            sleep 1
          done

      - name: Setup database for tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/taskflow
          API_KEY: dev_api_key_super_secret
        run: |
          echo "Setting up database for tests..."
          # Tenta configurar o banco de dados, mas não falha se não conseguir (útil para Act)
          python scripts/init_alembic.py || echo "Failed to initialize Alembic, but continuing..."
          python -m alembic upgrade head || echo "Failed to upgrade database, but continuing..."
          echo "Database setup complete (or skipped)"

      - name: Run all tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/taskflow
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/taskflow_test
          API_KEY: dev_api_key_super_secret
          USE_IN_PROCESS_TESTING: "true" # Usa testes em processo para evitar dependência de servidor externo
        run: |
          # Executa todos os testes com relatório de cobertura
          python -m pytest --cov=app tests/ --cov-report=xml --cov-report=term-missing

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
        # Não falha se o token não estiver disponível (útil para Act)
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for security scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: taskflow-manager:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-manager:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  build-and-push:
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/taskflow-manager
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
